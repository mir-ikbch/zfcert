name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2
          dune-cache: true

      - name: Install the WebAssembly toolchain
        run: |
          opam install -y \
            dune.3.23.1 \
            js_of_ocaml.6.4.1 \
            js_of_ocaml-ppx.6.4.1 \
            wasm_of_ocaml-compiler.6.4.1 \
            binaryen-bin.119

      - name: Run kernel self-tests
        run: opam exec -- dune exec src/main.exe -- --self-test

      - name: Build the browser assets
        run: opam exec -- make wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
